[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "T20", "BLE", "C4", "PT"]
ignore = [
    "B008",
    "BLE001",
    "S110",
    "T201",
    "PT009",
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
