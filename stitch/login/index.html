<div class="w-full max-w-[400px] bg-surface rounded-xl shadow-md p-6 flex flex-col gap-6 relative overflow-hidden">

<div class="flex flex-col gap-1">
<h1 class="font-headline-sm text-on-surface text-headline-sm">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant text-body-md">Sign in to continue to BaseMind</p>
</div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="w-full flex items-center justify-center gap-3 bg-surface border border-outline rounded-lg py-2.5 px-4 hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-on-surface font-label-md text-label-md">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26538 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"></path>

        Sign in with Google
      </button>
<button class="w-full flex items-center justify-center gap-3 bg-[#24292F] text-white rounded-lg py-2.5 px-4 hover:bg-[#24292F]/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-label-md text-label-md">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z" fill-rule="evenodd"></path>

        Sign in with GitHub
      </button>
</div>
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline-variant uppercase">Or continue with email</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Email Form -->
<form class="flex flex-col gap-5" id="loginForm">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface border border-outline rounded-lg py-2.5 px-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative w-full">
<input class="w-full bg-surface border border-outline rounded-lg py-2.5 pl-3 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-lg py-3 font-label-md text-label-md hover:bg-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center justify-center gap-2 group relative overflow-hidden" type="submit">
<span class="relative z-10">Sign In</span>
<span class="material-symbols-outlined text-[18px] relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Don't have an account? 
        <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('loginForm');
        const submitBtn = form.querySelector('button[type="submit"]');
        const btnText = submitBtn.querySelector('span:first-child');
        const btnIcon = submitBtn.querySelector('.material-symbols-outlined');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Loading state
            btnText.textContent = 'Signing in...';
            btnIcon.textContent = 'autorenew';
            btnIcon.classList.add('animate-spin');
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // Simulate API call
            setTimeout(() => {
                btnText.textContent = 'Sign In';
                btnIcon.textContent = 'arrow_forward';
                btnIcon.classList.remove('animate-spin');
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                
                // Optional: Show success state or redirect
                const email = document.getElementById('email').value;
                console.log('Logged in with:', email);
            }, 1500);
        });

        // Password visibility toggle
        const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
        const passwordInput = document.getElementById('password');
        const toggleIcon = toggleBtn.querySelector('span');

        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        });
    });
</script></main></body></html>
